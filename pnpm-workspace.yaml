# Flat, symlink-free node_modules. Vercel's serverless-function packager
# rejects functions whose traces cross pnpm's default isolated (symlinked)
# layout — "The framework produced an invalid deployment package for a
# Serverless Function… files in symlinked directories" — and the engine
# routes trace configured engine packages explicitly. The setting must
# live HERE (not an install flag): pnpm 11's verify-deps-before-run
# silently reinstalls with this file's settings before any `pnpm run`.
nodeLinker: hoisted
registries:
  default: https://registry.npmjs.org/
  "@samarthmn": https://npm.pkg.github.com/
allowBuilds:
  "@sentry/cli": true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
overrides:
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "ajv@8.20.0>fast-uri": 3.1.6
  "nanoid@3.3.17": 3.3.18
  "browserslist@4.28.6": 4.28.7
  "brace-expansion@1.1.16": 1.1.18
  "brace-expansion@5.0.7": 5.0.9
  "js-yaml@4.3.0": 4.3.1
minimumReleaseAgeExclude:
  - "@samarthmn/doc-yantra-office@0.0.25"
  - "@samarthmn/doc-yantra@0.0.25"
  - "@samarthmn/dockosha-provider-docyantra@0.0.25"
  - "@samarthmn/doc-yantra-fonts@0.0.25"
