# Standalone pnpm configuration boundary for this app. Deliberately omit a
# packages key: docs-site is not a member of the repository's parent workspace.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  "brace-expansion@1.1.16": 1.1.18
  "brace-expansion@5.0.8": 5.0.9
  "js-yaml@4.3.0": 4.3.1
  "nanoid@3.3.16": 3.3.18
