{
  "name": "CI",
  "on": {
    "push": null,
    "pull_request": null,
    "schedule": [
      {
        "cron": "17 3 * * 6"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "run_maintainer_engine": {
          "description": "Run protected private-engine validation on the default branch.",
          "required": true,
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "public-source": {
      "name": "Public source boundary",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 24,
            "package-manager-cache": false
          }
        },
        {
          "name": "Install pinned Gitleaks",
          "env": {
            "GITLEAKS_VERSION": "8.30.1",
            "GITLEAKS_ARCHIVE_SHA256": "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          },
          "run": "archive=\"${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\"\ncurl --fail --location --retry 5 \"https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\" --output \"$archive\"\necho \"${GITLEAKS_ARCHIVE_SHA256}  ${archive}\" | sha256sum --check --strict\nmkdir -p \"${RUNNER_TEMP}/gitleaks-bin\"\ntar --extract --file \"$archive\" --directory \"${RUNNER_TEMP}/gitleaks-bin\"\nchmod 0755 \"${RUNNER_TEMP}/gitleaks-bin/gitleaks\"\necho \"${RUNNER_TEMP}/gitleaks-bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Audit public source boundary",
          "run": "node scripts/check-public-manifest.mjs --mode=check"
        },
        {
          "name": "Audit committed source boundary",
          "run": "node scripts/check-public-manifest.mjs --mode=check --source=committed"
        },
        {
          "name": "Test source-release audit tools",
          "run": "node scripts/audit-tools.test.mjs\nnode scripts/license-audit.test.mjs\nnode scripts/release-references.test.mjs\n"
        },
        {
          "name": "Audit release references",
          "run": "node scripts/check-release-references.mjs"
        },
        {
          "name": "Audit repository secrets",
          "run": "node scripts/run-gitleaks.mjs"
        },
        {
          "name": "Audit committed repository secrets",
          "run": "node scripts/run-gitleaks.mjs --source=committed"
        }
      ]
    },
    "private-engine-checks": {
      "name": "Maintainer application build and tests",
      "if": "github.event_name == 'workflow_dispatch' && inputs.run_maintainer_engine == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "runs-on": "ubuntu-latest",
      "environment": "maintainer-engine-ci",
      "env": {
        "NEXT_PUBLIC_APP_URL": "http://localhost:3000",
        "NEXT_PUBLIC_ENABLE_PRODUCT_GUIDES": "false",
        "NEXT_PUBLIC_APP_ENV": "local",
        "NEXT_PUBLIC_SUPABASE_URL": "http://localhost:54321",
        "NEXT_PUBLIC_SUPABASE_ANON_KEY": "ci-public-placeholder",
        "SUPABASE_SERVICE_ROLE_KEY": "ci-public-placeholder",
        "NEXT_PUBLIC_GOOGLE_CLIENT_ID": "ci-public-placeholder",
        "R2_ENDPOINT": "http://localhost:9000",
        "R2_REGION": "us-east-1",
        "R2_ACCESS_KEY_ID": "minioadmin",
        "R2_SECRET_ACCESS_KEY": "minioadmin",
        "R2_BUCKET": "dockosha",
        "SMTP_HOST": "127.0.0.1",
        "SMTP_PORT": "54325",
        "SENDER_EMAIL": "ci@example.com",
        "NOTIFICATION_SENDER_EMAIL": "ci@example.com",
        "FOUNDER_SENDER_EMAIL": "ci@example.com",
        "COOKIE_SECRET": "ci-cookie-secret-placeholder-32-characters",
        "COMMENTS_AUTHOR_SECRET": "ci-comments-secret-placeholder-32-chars",
        "PLAYWRIGHT_BASE_URL": "http://localhost:3000"
      },
      "steps": [
        {
          "name": "Check out trusted source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up pnpm",
          "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093",
          "with": {
            "version": "11.25.0"
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 24,
            "package-manager-cache": false,
            "registry-url": "https://npm.pkg.github.com"
          }
        },
        {
          "name": "Install private-engine dependencies",
          "env": {
            "NODE_AUTH_TOKEN": "${{ secrets.GH_PACKAGES_READ_TOKEN }}"
          },
          "run": "test -n \"$NODE_AUTH_TOKEN\" || { echo \"GH_PACKAGES_READ_TOKEN is required\" >&2; exit 1; }\npnpm install --frozen-lockfile --ignore-scripts\n"
        },
        {
          "name": "Check formatting",
          "run": "pnpm format"
        },
        {
          "name": "Lint",
          "run": "pnpm lint"
        },
        {
          "name": "Typecheck",
          "run": "pnpm typecheck"
        },
        {
          "name": "Run unit tests",
          "run": "pnpm test:unit"
        },
        {
          "name": "Run engine unit gate",
          "run": "pnpm test:engine"
        },
        {
          "name": "Run audit-tool tests",
          "run": "pnpm test:audit-tools"
        },
        {
          "name": "Audit public manifest",
          "run": "pnpm audit:manifest"
        },
        {
          "name": "Audit dependency licenses",
          "run": "pnpm audit:licenses"
        },
        {
          "name": "Build application",
          "run": "pnpm build"
        }
      ]
    },
    "private-engine-e2e": {
      "name": "Maintainer engine E2E (manual/default branch)",
      "if": "github.event_name == 'workflow_dispatch' && inputs.run_maintainer_engine == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "runs-on": "ubuntu-latest",
      "needs": "private-engine-checks",
      "environment": "maintainer-engine-ci",
      "env": {
        "NEXT_PUBLIC_APP_URL": "http://localhost:3000",
        "NEXT_PUBLIC_ENABLE_PRODUCT_GUIDES": "false",
        "NEXT_PUBLIC_APP_ENV": "local",
        "NEXT_PUBLIC_SUPABASE_URL": "http://localhost:54321",
        "NEXT_PUBLIC_SUPABASE_ANON_KEY": "ci-public-placeholder",
        "SUPABASE_SERVICE_ROLE_KEY": "ci-public-placeholder",
        "NEXT_PUBLIC_GOOGLE_CLIENT_ID": "ci-public-placeholder",
        "R2_ENDPOINT": "http://localhost:9000",
        "R2_REGION": "us-east-1",
        "R2_ACCESS_KEY_ID": "minioadmin",
        "R2_SECRET_ACCESS_KEY": "minioadmin",
        "R2_BUCKET": "dockosha",
        "SMTP_HOST": "127.0.0.1",
        "SMTP_PORT": "54325",
        "SENDER_EMAIL": "ci@example.com",
        "NOTIFICATION_SENDER_EMAIL": "ci@example.com",
        "FOUNDER_SENDER_EMAIL": "ci@example.com",
        "COOKIE_SECRET": "ci-cookie-secret-placeholder-32-characters",
        "COMMENTS_AUTHOR_SECRET": "ci-comments-secret-placeholder-32-chars",
        "PLAYWRIGHT_BASE_URL": "http://localhost:3000"
      },
      "steps": [
        {
          "name": "Check out trusted source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up pnpm",
          "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093",
          "with": {
            "version": "11.25.0"
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 24,
            "package-manager-cache": false,
            "registry-url": "https://npm.pkg.github.com"
          }
        },
        {
          "name": "Install private-engine dependencies",
          "env": {
            "NODE_AUTH_TOKEN": "${{ secrets.GH_PACKAGES_READ_TOKEN }}"
          },
          "run": "test -n \"$NODE_AUTH_TOKEN\" || { echo \"GH_PACKAGES_READ_TOKEN is required\" >&2; exit 1; }\npnpm install --frozen-lockfile --ignore-scripts\n"
        },
        {
          "name": "Install pinned Supabase CLI",
          "uses": "supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf",
          "with": {
            "version": "2.39.2"
          }
        },
        {
          "name": "Start E2E backing services",
          "run": "supabase start\ndocker compose -f docker-compose.r2.yml up -d\nsupabase status -o env > \"$RUNNER_TEMP/supabase.env\"\nAPI_URL=\"$(sed -n 's/^API_URL=//p' \"$RUNNER_TEMP/supabase.env\" | tr -d '\\\"')\"\nANON_KEY=\"$(sed -n 's/^ANON_KEY=//p' \"$RUNNER_TEMP/supabase.env\" | tr -d '\\\"')\"\nSERVICE_ROLE_KEY=\"$(sed -n 's/^SERVICE_ROLE_KEY=//p' \"$RUNNER_TEMP/supabase.env\" | tr -d '\\\"')\"\nMAILPIT_URL=\"$(sed -n 's/^MAILPIT_URL=//p' \"$RUNNER_TEMP/supabase.env\" | tr -d '\\\"')\"\nif test -z \"$MAILPIT_URL\"; then MAILPIT_URL=\"$(sed -n 's/^INBUCKET_URL=//p' \"$RUNNER_TEMP/supabase.env\" | tr -d '\\\"')\"; fi\ntest -n \"$API_URL\" && test -n \"$ANON_KEY\" && test -n \"$SERVICE_ROLE_KEY\" && test -n \"$MAILPIT_URL\"\n{\n  echo \"NEXT_PUBLIC_SUPABASE_URL=$API_URL\"\n  echo \"NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY\"\n  echo \"SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY\"\n  echo \"MAILPIT_BASE_URL=$MAILPIT_URL\"\n} >> \"$GITHUB_ENV\"\ncurl --fail-with-body --retry 10 --retry-delay 2 -H \"apikey: $ANON_KEY\" \"$API_URL/rest/v1/\"\ncurl --fail-with-body --retry 10 --retry-delay 2 http://127.0.0.1:9000/minio/health/live\ndocker compose -f docker-compose.r2.yml ps --status running\n"
        },
        {
          "name": "Check Mailpit UI health",
          "run": "curl --fail-with-body --retry 10 --retry-delay 2 \"$MAILPIT_BASE_URL/api/v1/messages\""
        },
        {
          "name": "Build application",
          "run": "pnpm build"
        },
        {
          "name": "Verify fixed engine build trace",
          "run": "node scripts/verify-engine-build-artifact.mjs"
        },
        {
          "name": "Install pinned Playwright Chromium dependencies",
          "run": "pnpm exec playwright install --with-deps chromium"
        },
        {
          "name": "Run engine Playwright suite",
          "run": "pnpm e2e:engine"
        }
      ]
    }
  }
}
