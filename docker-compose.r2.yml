# MinIO - S3-compatible object storage for local R2 simulation
# Start: docker compose -f docker-compose.r2.yml up -d
# Stop: docker compose -f docker-compose.r2.yml down
#
# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION R2 CORS CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# Configure the following CORS rules on your Cloudflare R2 bucket:
#
#   AllowedOrigins: ["*"]  (or specific domains like ["https://your-domain.com"])
#   AllowedMethods: ["GET", "HEAD", "PUT"]
#   AllowedHeaders: ["*"]
#   ExposeHeaders:  ["ETag", "Content-Length", "Content-Range", "Accept-Ranges",
#                    "Content-Disposition", "Content-Type"]
#   MaxAgeSeconds:  86400
#
# These headers are required for:
# - PDF.js Range requests (Content-Range, Accept-Ranges)
# - Presigned PUT uploads (ETag)
# - Direct downloads with proper filenames (Content-Disposition)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  minio:
    build:
      context: ./scripts/minio
      target: minio
    container_name: dockosha-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MinIO configures CORS at server level, not through the S3 bucket CORS API.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Creates the default bucket on first startup
  minio-init:
    build:
      context: ./scripts/minio
      target: mc
    container_name: dockosha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set minio http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing minio/dockosha
        mc anonymous set download minio/dockosha
        echo 'MinIO bucket dockosha created and configured'

volumes:
  minio-data:
